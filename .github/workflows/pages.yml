name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir _site
          cp -r index.html classic.html app.css style.css js lib lzma data assets logo_*.mp4 logo_repeat.gif _site/
          # Shown in the page so a bug report says which build it came from
          sed -i "s|<meta name=\"build\" content=\"dev\" />|<meta name=\"build\" content=\"${GITHUB_SHA::7}\" />|" _site/index.html
          grep -q "content=\"${GITHUB_SHA::7}\"" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
